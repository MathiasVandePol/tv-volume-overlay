plugins { id 'com.android.application' }
def signing = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
def storePath = signing.getProperty('storeFile') ?: System.getenv('ANDROID_KEYSTORE_PATH')
android {
    namespace 'be.mathiasvandepol.tvvolume'
    compileSdk 35
    defaultConfig {
        applicationId 'be.mathiasvandepol.tvvolume'
        minSdk 33
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode (providers.gradleProperty('appVersionCode').getOrElse('10100') as int)
        versionName providers.gradleProperty('appVersionName').getOrElse('1.1.0-dev')
    }
    signingConfigs {
        if (storePath) {
            release {
                storeFile file(storePath)
                storePassword signing.getProperty('storePassword') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias signing.getProperty('keyAlias') ?: System.getenv('ANDROID_KEY_ALIAS')
                keyPassword signing.getProperty('keyPassword') ?: System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (storePath) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
